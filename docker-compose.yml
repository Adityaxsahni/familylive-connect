version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: familylive_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes: [familylive-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  backend:
    build: ./services/backend
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      REDIS_HOST: redis
    ports: ['3000:3000']
    depends_on: [postgres, redis]
volumes:
  familylive-postgres:
